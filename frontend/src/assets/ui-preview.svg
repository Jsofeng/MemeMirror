<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" rx="14" fill="#09090b"/>
  <!-- header -->
  <text x="32" y="46" font-size="24" font-weight="700" fill="#ffffff">MemeMirror</text>
  <text x="32" y="68" font-size="13" fill="#a1a1aa">Recreate the pose. Find your meme.</text>
  <line x1="0" y1="86" x2="900" y2="86" stroke="#27272a" stroke-width="1"/>

  <!-- camera card -->
  <rect x="32" y="110" width="540" height="380" rx="16" fill="#18181b" stroke="#27272a"/>
  <text x="302" y="300" font-size="15" fill="#71717a" text-anchor="middle">Live webcam feed</text>
  <text x="302" y="322" font-size="12" fill="#52525b" text-anchor="middle">(pose skeleton overlay)</text>
  <!-- stick figure -->
  <g stroke="#4ade80" stroke-width="3" stroke-linecap="round" fill="#4ade80">
    <circle cx="302" cy="170" r="16" fill="none"/>
    <line x1="302" y1="186" x2="302" y2="250"/>
    <line x1="302" y1="200" x2="262" y2="236"/>
    <line x1="302" y1="200" x2="342" y2="224"/>
    <line x1="262" y1="236" x2="250" y2="268"/>
    <line x1="342" y1="224" x2="356" y2="196"/>
    <circle cx="302" cy="200" r="4"/><circle cx="262" cy="236" r="4"/><circle cx="342" cy="224" r="4"/>
    <circle cx="250" cy="268" r="4"/><circle cx="356" cy="196" r="4"/>
  </g>
  <text x="48" y="140" font-size="14" font-style="italic" fill="#4ade80">Meme Match: six_seven</text>

  <!-- meme match panel -->
  <text x="600" y="126" font-size="17" font-weight="600" fill="#ffffff">Meme Match</text>
  <rect x="600" y="140" width="268" height="268" rx="16" fill="#18181b" stroke="#27272a"/>
  <rect x="640" y="180" width="188" height="188" rx="10" fill="#27272a"/>
  <text x="734" y="270" font-size="44" text-anchor="middle">🖼️</text>
  <text x="734" y="306" font-size="13" fill="#a1a1aa" text-anchor="middle">meme image</text>
  <text x="734" y="436" font-size="15" font-weight="600" fill="#4ade80" text-anchor="middle">Six seven detected!</text>

  <!-- idle state hint -->
  <text x="734" y="474" font-size="12" fill="#71717a" text-anchor="middle">Idle: "No meme detected yet"</text>
</svg>
